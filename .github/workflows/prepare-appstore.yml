name: Prepare App Store Release (not in use)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version for this release (e.g., 1.2.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-iphone-screenshots:
    name: Generate iPhone Screenshots
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install ImageMagick (required for screenshot normalization)
        run: brew install imagemagick

      - name: Clean and pre-boot simulator
        timeout-minutes: 10
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl delete unavailable || true
          # Pre-boot iPhone simulator to reduce test startup time
          echo "Pre-booting iPhone 17 Pro Max simulator..."
          DEVICE_UDID=$(.github/scripts/resolve-simulator.sh iOS "iPhone 17 Pro Max")
          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl status_bar "$DEVICE_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 2>/dev/null || true
          echo "✅ Simulator pre-booted and ready"

      - name: Generate iPhone screenshots
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 45
          max_attempts: 2
          retry_wait_seconds: 30
          command: bundle exec fastlane ios screenshots_iphone
        env:
          SNAPSHOT_SIMULATOR_WAIT_FOR_BOOT_TIMEOUT: "60"

      - name: Upload iPhone screenshots artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-iphone
          path: fastlane/screenshots_compat/
          retention-days: 30

      - name: Upload xcresult and logs for diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-iphone
          path: |
            ~/Library/Logs/snapshot
            **/Logs/Test/*.xcresult
          retention-days: 7

  generate-ipad-screenshots:
    name: Generate iPad Screenshots
    runs-on: macos-26
    timeout-minutes: 120  # iPad is significantly slower than iPhone in CI (needs ~84min for both locales)
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install ImageMagick (required for screenshot normalization)
        run: brew install imagemagick

      - name: Clean and pre-boot simulator
        timeout-minutes: 10
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl delete unavailable || true
          # Pre-boot iPad simulator to reduce test startup time
          echo "Pre-booting iPad Pro 13-inch (M5) simulator..."
          DEVICE_UDID=$(.github/scripts/resolve-simulator.sh iOS "iPad Pro 13-inch (M5)")
          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl status_bar "$DEVICE_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 2>/dev/null || true
          echo "✅ Simulator pre-booted and ready"

      - name: Generate iPad screenshots
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60  # iPad needs more time due to slower simulator performance
          max_attempts: 2
          retry_wait_seconds: 30
          command: bundle exec fastlane ios screenshots_ipad
        env:
          SNAPSHOT_SIMULATOR_WAIT_FOR_BOOT_TIMEOUT: "60"

      - name: Upload iPad screenshots artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-ipad
          path: fastlane/screenshots_compat/
          retention-days: 30

      - name: Upload xcresult and logs for diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ipad
          path: |
            ~/Library/Logs/snapshot
            **/Logs/Test/*.xcresult
          retention-days: 7

  generate-watch-screenshots:
    name: Generate Watch Screenshots
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install ImageMagick (required for screenshot normalization)
        run: brew install imagemagick

      - name: Clean simulator state
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl delete unavailable || true
          # One Xcode + one runtime: resolve (or create) the exact Watch device
          WATCH_UDID=$(.github/scripts/resolve-simulator.sh watchOS "Apple Watch Series 11 (46mm)")
          echo "Using watchOS simulator UDID: ${WATCH_UDID}"

      - name: Generate Watch screenshots
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 45
          max_attempts: 2
          retry_wait_seconds: 30
          command: bundle exec fastlane ios watch_screenshots
        env:
          SNAPSHOT_SIMULATOR_WAIT_FOR_BOOT_TIMEOUT: "60"

      - name: Upload Watch screenshots artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-watch
          path: fastlane/screenshots/watch_normalized/
          retention-days: 30

      - name: Upload HTML report
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-report-watch
          path: fastlane/screenshots/watch/screenshots.html
          retention-days: 30

      - name: Upload xcresult and logs for diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-watch
          path: |
            ~/Library/Logs/snapshot
            ~/Library/Logs/scan
            **/Logs/Test/*.xcresult
          retention-days: 7

  upload-to-appstore:
    name: Upload Metadata & Screenshots
    needs: [generate-iphone-screenshots, generate-ipad-screenshots, generate-watch-screenshots]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install ImageMagick (required for screenshot validation)
        run: brew install imagemagick

      # Start from empty dirs: committed screenshots must not mix with the fresh
      # artifacts (different device names would otherwise upload both sets)
      - name: Reset screenshot directories
        run: |
          rm -rf fastlane/screenshots_compat fastlane/screenshots/watch_normalized
          mkdir -p fastlane/screenshots_compat fastlane/screenshots/watch_normalized

      - name: Download iPhone screenshots
        uses: actions/download-artifact@v8
        with:
          name: screenshots-iphone
          path: fastlane/screenshots_compat/

      - name: Download iPad screenshots
        uses: actions/download-artifact@v8
        with:
          name: screenshots-ipad
          path: fastlane/screenshots_compat/

      - name: Download Watch screenshots
        uses: actions/download-artifact@v8
        with:
          name: screenshots-watch
          path: fastlane/screenshots/watch_normalized/

      - name: List merged screenshots
        run: |
          echo "=== iPhone/iPad Screenshots (screenshots_compat) ==="
          find fastlane/screenshots_compat -name "*.png" | head -20
          echo ""
          echo "=== Watch Screenshots ==="
          find fastlane/screenshots/watch_normalized -name "*.png" | head -20

      - name: Validate screenshots before upload
        run: bundle exec fastlane ios validate_delivery_screenshots

      - name: Upload metadata and screenshots to App Store Connect
        run: bundle exec fastlane release version:${{ inputs.version }}

      - name: Summary
        run: |
          echo "## 🎉 App Store Preparation Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Screenshots Generated & Uploaded" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ iPhone (EN + FI): 5 screenshots (1290x2796)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ iPad 13\" (EN + FI): 4 screenshots (2064x2752)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Watch (EN + FI): 10 screenshots (416x496)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to [App Store Connect](https://appstoreconnect.apple.com)" >> $GITHUB_STEP_SUMMARY
          echo "2. Create a new version: **${{ inputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "3. Select the TestFlight build you want to release" >> $GITHUB_STEP_SUMMARY
          echo "4. Review the uploaded screenshots and metadata" >> $GITHUB_STEP_SUMMARY
          echo "5. Submit for review" >> $GITHUB_STEP_SUMMARY
