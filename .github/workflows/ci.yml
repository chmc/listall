name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs when new commits are pushed (Critical Reviewer C2)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  #############################################################################
  # Job 1: iOS Build and Test (~12-15 min)
  #############################################################################
  build-and-test-ios:
    name: Build and Test iOS
    runs-on: macos-26
    timeout-minutes: 35

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Xcode
      uses: ./.github/actions/setup-xcode

    # Platform-specific cache key prevents cross-platform cache corruption
    - name: Cache DerivedData
      uses: actions/cache@v5
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-xcode-${{ hashFiles('.xcode-version') }}-derived-data-ios-${{ hashFiles('**/ListAll.xcodeproj/project.pbxproj') }}
        restore-keys: |
          ${{ runner.os }}-xcode-${{ hashFiles('.xcode-version') }}-derived-data-ios-

    # Pre-flight: Clean simulator state to prevent boot failures
    - name: Clean simulator state
      run: |
        xcrun simctl shutdown all || true
        xcrun simctl delete unavailable || true

    - name: Resolve iOS simulator
      id: ios-sim
      run: |
        UDID=$(.github/scripts/resolve-simulator.sh iOS "iPhone 17 Pro")
        echo "Using iOS simulator UDID: ${UDID}"
        echo "udid=${UDID}" >> "$GITHUB_OUTPUT"

    # Note: enabling Swift 6 strict concurrency will require disabling
    # SWIFT_TREAT_WARNINGS_AS_ERRORS temporarily until migration is complete.
    - name: Build iOS app
      run: |
        set -o pipefail
        cd ListAll
        xcodebuild clean build \
          -project ListAll.xcodeproj \
          -scheme ListAll \
          -destination "platform=iOS Simulator,id=${{ steps.ios-sim.outputs.udid }}" \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
          RUN_CLANG_STATIC_ANALYZER=YES \
          | xcbeautify --renderer github-actions

    - name: Run iOS tests
      run: |
        set -o pipefail
        cd ListAll
        xcodebuild test \
          -project ListAll.xcodeproj \
          -scheme ListAll \
          -destination "platform=iOS Simulator,id=${{ steps.ios-sim.outputs.udid }}" \
          -resultBundlePath TestResults.xcresult \
          -parallel-testing-enabled NO \
          -enableCodeCoverage YES \
          -skip-testing:ListAllTests/AppGroupsTests \
          -skip-testing:ListAllTests/CloudKitTests \
          -skip-testing:ListAllUITests \
          -skip-testing:ListAllUITestsLaunchTests \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
          RUN_CLANG_STATIC_ANALYZER=YES \
          | xcbeautify --renderer github-actions

    # Release-configuration compile check (includes the embedded watch app).
    # TestFlight archives Release; Debug-only CI let Release-only build
    # settings break the 1.1.22 macOS release.
    - name: Build iOS app (Release)
      run: |
        set -o pipefail
        cd ListAll
        xcodebuild build \
          -project ListAll.xcodeproj \
          -scheme ListAll \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          | xcbeautify --renderer github-actions

    # macos-26 runner: 3 vCPU / 7 GB. Simulator tests run serially (no clones) because
    # random multi-second stalls (trivial tests taking 30-190 s) broke timing tests;
    # this snapshot shows whether memory pressure / swap is the cause.
    - name: Log memory and swap usage
      if: always()
      run: |
        sysctl -n hw.ncpu hw.memsize vm.swapusage
        memory_pressure -Q || true

    # Always upload test results for debugging, even on success
    - name: Upload iOS test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ios-test-results
        path: ListAll/TestResults.xcresult
        retention-days: 30

    - name: Extract iOS code coverage
      if: always()
      run: |
        cd ListAll
        ../scripts/extract-coverage.sh TestResults.xcresult coverage-ios.json

    - name: Upload iOS coverage JSON
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ios-coverage
        path: ListAll/coverage-ios.json
        retention-days: 30

    # Upload diagnostic logs only on failure to reduce artifact storage
    - name: Upload iOS test logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ios-test-logs
        path: |
          ~/Library/Logs/DiagnosticReports
          ~/Library/Developer/Xcode/DerivedData/*/Logs
        retention-days: 7

  #############################################################################
  # Job 2: watchOS Build and Test (~3-5 min, unit tests only)
  #############################################################################
  build-and-test-watchos:
    name: Build and Test watchOS
    runs-on: macos-26
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Xcode
      uses: ./.github/actions/setup-xcode

    # Platform-specific cache key prevents cross-platform cache corruption
    - name: Cache DerivedData
      uses: actions/cache@v5
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-xcode-${{ hashFiles('.xcode-version') }}-derived-data-watchos-${{ hashFiles('**/ListAll.xcodeproj/project.pbxproj') }}
        restore-keys: |
          ${{ runner.os }}-xcode-${{ hashFiles('.xcode-version') }}-derived-data-watchos-

    # Pre-flight: Clean simulator state to prevent boot failures
    - name: Clean simulator state
      run: |
        xcrun simctl shutdown all || true
        xcrun simctl delete unavailable || true

    - name: Resolve watchOS simulator
      id: watch-sim
      run: |
        UDID=$(.github/scripts/resolve-simulator.sh watchOS "Apple Watch Series 11 (46mm)")
        echo "Using watchOS simulator UDID: ${UDID}"
        echo "udid=${UDID}" >> "$GITHUB_OUTPUT"

    - name: Pre-boot watchOS simulator
      run: |
        xcrun simctl boot "${{ steps.watch-sim.outputs.udid }}" || true
        xcrun simctl bootstatus "${{ steps.watch-sim.outputs.udid }}" -b
        sleep 5

    - name: Build watchOS app
      run: |
        set -o pipefail
        cd ListAll
        xcodebuild clean build \
          -project ListAll.xcodeproj \
          -scheme "ListAllWatch Watch App" \
          -destination "platform=watchOS Simulator,id=${{ steps.watch-sim.outputs.udid }}" \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
          RUN_CLANG_STATIC_ANALYZER=YES \
          | xcbeautify --renderer github-actions

    - name: Run watchOS tests
      timeout-minutes: 10
      run: |
        set -o pipefail
        cd ListAll

        # Test plan runs unit tests only (UI tests excluded from plan)
        xcodebuild test \
          -project ListAll.xcodeproj \
          -scheme "ListAllWatch Watch App" \
          -destination "platform=watchOS Simulator,id=${{ steps.watch-sim.outputs.udid }}" \
          -resultBundlePath TestResults-Watch.xcresult \
          -parallel-testing-enabled NO \
          -enableCodeCoverage YES \
          -skip-testing:"ListAllWatch Watch AppUITests" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
          RUN_CLANG_STATIC_ANALYZER=YES \
          | xcbeautify --renderer github-actions

    # macos-26 runner: 3 vCPU / 7 GB. Simulator tests run serially (no clones) because
    # random multi-second stalls (trivial tests taking 30-190 s) broke timing tests;
    # this snapshot shows whether memory pressure / swap is the cause.
    - name: Log memory and swap usage
      if: always()
      run: |
        sysctl -n hw.ncpu hw.memsize vm.swapusage
        memory_pressure -Q || true

    # Always upload test results for debugging, even on success
    - name: Upload watchOS test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: watchos-test-results
        path: ListAll/TestResults-Watch.xcresult
        retention-days: 30

    - name: Extract watchOS code coverage
      if: always()
      run: |
        cd ListAll
        ../scripts/extract-coverage.sh TestResults-Watch.xcresult coverage-watchos.json

    - name: Upload watchOS coverage JSON
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: watchos-coverage
        path: ListAll/coverage-watchos.json
        retention-days: 30

    # Upload diagnostic logs only on failure to reduce artifact storage
    - name: Upload watchOS test logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: watchos-test-logs
        path: |
          ~/Library/Logs/DiagnosticReports
          ~/Library/Developer/Xcode/DerivedData/*/Logs
        retention-days: 7

  #############################################################################
  # Job 3: macOS Build and Test (~8-10 min, no simulator overhead)
  #############################################################################
  build-and-test-macos:
    name: Build and Test macOS
    runs-on: macos-26
    timeout-minutes: 20  # Shorter timeout - no simulator overhead

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Xcode
      uses: ./.github/actions/setup-xcode

    # Platform-specific cache key prevents cross-platform cache corruption
    - name: Cache DerivedData
      uses: actions/cache@v5
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-xcode-${{ hashFiles('.xcode-version') }}-derived-data-macos-${{ hashFiles('**/ListAll.xcodeproj/project.pbxproj') }}
        restore-keys: |
          ${{ runner.os }}-xcode-${{ hashFiles('.xcode-version') }}-derived-data-macos-

    - name: Build macOS app
      run: |
        set -o pipefail
        cd ListAll
        xcodebuild clean build \
          -project ListAll.xcodeproj \
          -scheme ListAllMac \
          -destination 'platform=macOS' \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
          RUN_CLANG_STATIC_ANALYZER=YES \
          | xcbeautify --renderer github-actions

    - name: Run macOS tests
      run: |
        set -o pipefail
        cd ListAll
        xcodebuild test \
          -project ListAll.xcodeproj \
          -scheme ListAllMac \
          -destination 'platform=macOS' \
          -resultBundlePath TestResults-Mac.xcresult \
          -enableCodeCoverage YES \
          -skip-testing:ListAllMacUITests \
          -skip-testing:MacKeyboardNavigationTests \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
          RUN_CLANG_STATIC_ANALYZER=YES \
          | xcbeautify --renderer github-actions

    # Release-configuration compile check: TestFlight archives Release, and
    # Release-only build settings broke the 1.1.22 macOS release.
    - name: Build macOS app (Release)
      run: |
        set -o pipefail
        cd ListAll
        xcodebuild build \
          -project ListAll.xcodeproj \
          -scheme ListAllMac \
          -destination 'generic/platform=macOS' \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          | xcbeautify --renderer github-actions

    # Always upload test results for debugging, even on success
    - name: Upload macOS test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: macos-test-results
        path: ListAll/TestResults-Mac.xcresult
        retention-days: 30

    - name: Extract macOS code coverage
      if: always()
      run: |
        cd ListAll
        ../scripts/extract-coverage.sh TestResults-Mac.xcresult coverage-macos.json

    - name: Upload macOS coverage JSON
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: macos-coverage
        path: ListAll/coverage-macos.json
        retention-days: 30

    # Upload diagnostic logs only on failure to reduce artifact storage
    - name: Upload macOS test logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: macos-test-logs
        path: |
          ~/Library/Logs/DiagnosticReports
          ~/Library/Developer/Xcode/DerivedData/*/Logs
        retention-days: 7

  #############################################################################
  # Job 4: CI Summary (aggregates results, runs on cheap ubuntu runner)
  # Critical Reviewer C3: Explicit failure detection for branch protection
  #############################################################################
  ci-summary:
    name: CI Summary
    needs: [build-and-test-ios, build-and-test-watchos, build-and-test-macos]
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: Check all platform builds succeeded
      run: |
        echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | Result |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| iOS | ${{ needs.build-and-test-ios.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| watchOS | ${{ needs.build-and-test-watchos.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| macOS | ${{ needs.build-and-test-macos.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Fail if any platform failed
        if [[ "${{ needs.build-and-test-ios.result }}" != "success" ]] || \
           [[ "${{ needs.build-and-test-watchos.result }}" != "success" ]] || \
           [[ "${{ needs.build-and-test-macos.result }}" != "success" ]]; then
          echo "::error::One or more platform builds failed"
          echo "**Status: FAILED** - One or more platforms did not succeed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        echo "**Status: PASSED** - All platforms succeeded" >> $GITHUB_STEP_SUMMARY
        echo "All platform builds succeeded!"
